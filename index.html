<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unreliable Map — あてにならない地図</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #101014;
        color: #cfcabb;
        font-family: 'Menlo', 'Osaka-Mono', 'MS Gothic', monospace;
        display: flex;
        justify-content: center;
      }
      main {
        max-width: 760px;
        width: 100%;
        padding: 16px;
      }
      pre#screen {
        white-space: pre-wrap;
        line-height: 1.5;
        font-size: 14px;
        margin: 0 0 12px;
      }
      #actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-bottom: 32px;
      }
      #actions button {
        background: #1c1c24;
        color: #cfcabb;
        border: 1px solid #3a3a46;
        padding: 8px 14px;
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      #actions button:hover {
        background: #2a2a36;
      }
    </style>
  </head>
  <body>
    <main>
      <pre id="screen"></pre>
      <div id="actions"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
